name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install bubblewrap and unrestrict userns (RUN sandbox; Ubuntu's apparmor
          bwrap profile passes the userns probe but then denies caps/uid-map inside — a
          hybrid our tiers cannot satisfy, so CI tests tier 1 on an unrestricted kernel;
          tier 2 is covered by the kernel-level seccomp tests)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apparmor_parser -R /etc/apparmor.d/bwrap 2>/dev/null || true
      - name: Start a user systemd manager (tour scenarios need one)
        run: |
          sudo loginctl enable-linger "$(whoami)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-system-running >/dev/null 2>&1 && break
            sleep 1
          done
          XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-system-running || true
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  vm-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#checks.x86_64-linux.vm-dogfood -L
