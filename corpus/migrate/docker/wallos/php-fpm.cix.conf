[global]
daemonize = no
error_log = /dev/null

[www]
listen = /dev/shm/wallos-cix/php-fpm.sock
pm = dynamic
pm.max_children = 15
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
php_admin_value[session.save_path] = /dev/shm/wallos-cix/sessions
