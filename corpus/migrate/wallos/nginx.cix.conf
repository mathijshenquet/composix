worker_processes 1;
error_log /dev/null crit;
pid /dev/shm/wallos-cix/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /dev/shm/wallos-cix/nginx-client;
    proxy_temp_path /dev/shm/wallos-cix/nginx-proxy;
    fastcgi_temp_path /dev/shm/wallos-cix/fastcgi-temp;
    uwsgi_temp_path /dev/shm/wallos-cix/uwsgi-temp;
    scgi_temp_path /dev/shm/wallos-cix/scgi-temp;

    server {
        listen [::]:80 ipv6only=off;
        listen [::]:18092 ipv6only=off;
        server_name localhost;

        location / {
            root /app;
            index index.php;
        }

        location ~ \.php$ {
            root /app;
            fastcgi_pass unix:/dev/shm/wallos-cix/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
        }

        location ~ \.db$ {
            deny all;
            return 403;
        }

        location ~* images/uploads/logos/.*\.php$ {
            deny all;
            return 403;
        }

        location ~* \.tmp/.*\.php$ {
            deny all;
            return 403;
        }

        location ~* ^/includes/.*\.php$ {
            deny all;
            return 403;
        }
    }
}
