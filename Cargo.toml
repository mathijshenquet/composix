[workspace]
resolver = "2"
members = [
  "crates/cix",
  "crates/cix-cixfile",
  "crates/cix-common",
  "crates/cix-import",
  "crates/cix-index",
  "crates/cix-run",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cix-common = { path = "crates/cix-common" }
cix-cixfile = { path = "crates/cix-cixfile" }
cix-import = { path = "crates/cix-import" }
cix-index = { path = "crates/cix-index" }
cix-run = { path = "crates/cix-run" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
tempfile = "3"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
